name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build web app
        run: npm run build
      - name: Smoke-test the compiled CLI
        run: node dist-cli/cli.js 7c3aed --format json | node -e "JSON.parse(require('fs').readFileSync(0, 'utf8'))"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility checks
        run: npm run e2e
